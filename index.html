<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D 파티 텍스트</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#050816; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  #ui { position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:0 22px 30px; }
  #inputWrap { position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); width:min(78vw,520px); pointer-events:auto; }
  #textInput {
    width:100%; height:64px; border:1px solid rgba(255,255,255,.25); border-radius:18px;
    background:rgba(255,255,255,.95); color:#111827; outline:none; text-align:center;
    font-size:24px; padding:0 18px; box-shadow:0 12px 45px rgba(0,0,0,.3);
  }
  #start {
    pointer-events:auto; border:0; border-radius:16px; min-width:190px; height:56px;
    padding:0 30px; background:#071a46; color:white; font-weight:800; font-size:19px;
    box-shadow:0 8px 25px rgba(0,0,0,.35); cursor:pointer; transition:transform .15s, background .2s;
  }
  #start:active { transform:scale(.96); }
  #hint { color:rgba(255,255,255,.7); font-size:13px; margin-top:12px; }
  #status { position:fixed; top:14px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.75); font-size:12px; pointer-events:none; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <div id="inputWrap"><input id="textInput" maxlength="24" placeholder="문구를 입력하세요" autocomplete="off"></div>
  <button id="start">시작하기</button>
  <div id="hint">글자가 화면 벽에 튕기며 움직입니다</div>
</div>
<div id="status">READY</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const app = document.getElementById("app");
const input = document.getElementById("textInput");
const startBtn = document.getElementById("start");
const inputWrap = document.getElementById("inputWrap");
const hint = document.getElementById("hint");
const status = document.getElementById("status");

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050816);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 100);
camera.position.set(0,0,15);
camera.lookAt(0,0,0);

const ambient = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(ambient);

const lights = [
  new THREE.PointLight(0xff2020, 2.5, 30),
  new THREE.PointLight(0x20ff50, 2.5, 30),
  new THREE.PointLight(0x2060ff, 2.5, 30)
];
lights[0].position.set(-7,4,5);
lights[1].position.set(7,1,4);
lights[2].position.set(0,-5,6);
lights.forEach(l=>scene.add(l));

const textGroup = new THREE.Group();
scene.add(textGroup);

let active = false;
let birth = 0;
let velocity = new THREE.Vector3(.055,.037,0);
let rotationVelocity = new THREE.Vector3(.006,.009,.004);
let bounds = {x:6,y:4.2};
let textWidth = 3;
let textHeight = 1.25;
let currentText = "";

function hsl(h,s,l){
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h*6)%2-1)), m=l-c/2;
  let r=0,g=0,b=0;
  if(h<1/6){r=c;g=x}else if(h<2/6){r=x;g=c}else if(h<3/6){g=c;b=x}
  else if(h<4/6){g=x;b=c}else if(h<5/6){r=x;b=c}else{r=c;b=x}
  return new THREE.Color(r+m,g+m,b+m);
}

/*
  핵심 변경:
  외부 한글 폰트를 다운로드하지 않고 브라우저의 기본 한글 폰트를 Canvas에 직접 그립니다.
  따라서 안드로이드/PC에서 별도의 WOFF2 파일이 없어도 한글이 표시됩니다.
*/
function makeTextTexture(str){
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  const fontSize = 180;
  const font = `800 ${fontSize}px system-ui, -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif`;
  ctx.font = font;
  const measured = Math.max(ctx.measureText(str).width, 240);
  const pad = 35;
  c.width = Math.ceil(measured + pad*2);
  c.height = 260;
  ctx.font = font;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // 가장자리/깊이층이 잘 보이도록 어두운 외곽선을 먼저 그림
  ctx.lineJoin = "round";
  ctx.lineWidth = 22;
  ctx.strokeStyle = "rgba(0,0,0,.85)";
  ctx.strokeText(str, c.width/2, c.height/2+3);

  ctx.lineWidth = 8;
  ctx.strokeStyle = "rgba(255,255,255,.25)";
  ctx.strokeText(str, c.width/2, c.height/2);

  const grad = ctx.createLinearGradient(0,0,c.width,c.height);
  grad.addColorStop(0,"#ffffff");
  grad.addColorStop(.45,"#f7f7ff");
  grad.addColorStop(1,"#b8c5ff");
  ctx.fillStyle = grad;
  ctx.fillText(str, c.width/2, c.height/2);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.needsUpdate = true;
  return {tex, aspect:c.width/c.height};
}

function clearText(){
  while(textGroup.children.length){
    const obj = textGroup.children.pop();
    obj.geometry.dispose();
    obj.material.map?.dispose();
    obj.material.dispose();
  }
}

function createText(str){
  clearText();
  const {tex, aspect} = makeTextTexture(str);

  // 화면 중앙 기준 적당한 크기로 맞춤
  const targetH = 1.55;
  const w = targetH * aspect;
  textWidth = w;
  textHeight = targetH;

  // 여러 장을 아주 조금씩 겹쳐 실제 깊이가 있는 것처럼 보이게 함
  const depth = 0.22;
  const layers = 12;
  for(let i=0;i<layers;i++){
    const geo = new THREE.PlaneGeometry(w, targetH);
    const mat = new THREE.MeshStandardMaterial({
      map: tex,
      transparent:true,
      roughness:.34,
      metalness:.15,
      side:THREE.DoubleSide,
      depthWrite:true
    });
    const mesh = new THREE.Mesh(geo,mat);
    mesh.position.z = -i*depth/layers;
    mesh.position.y = i*0.008;
    textGroup.add(mesh);
  }
  textGroup.position.set(0,0,0);
  textGroup.rotation.set(0,0,0);
}

// 지정된 이모지만 파티클로 사용합니다.
const EMOJIS = ["🤩","🥀","😍","❤️","👽","🐴","👄","🐑","🤣","🥳"];
let particleTextureCache = new Map();

function getEmojiTexture(emoji){
  if(particleTextureCache.has(emoji)) return particleTextureCache.get(emoji);

  const c = document.createElement("canvas");
  c.width = 192;
  c.height = 192;
  const ctx = c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = '150px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.fillText(emoji,96,100);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  particleTextureCache.set(emoji,tex);
  return tex;
}

function createEmojiBurst(count){
  const group = new THREE.Group();
  group.renderOrder = 5;

  const particleData = [];

  for(let i=0;i<count;i++){
    const emoji = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
    const texture = getEmojiTexture(emoji);

    const material = new THREE.SpriteMaterial({
      map:texture,
      transparent:true,
      depthWrite:false,
      depthTest:true,
      opacity:0
    });

    const sprite = new THREE.Sprite(material);

    // 글자의 정확한 중심에서 시작해서 사방으로 "팡!" 하고 퍼짐
    const angle = Math.random()*Math.PI*2;
    const spread = .8 + Math.random()*.9;

    sprite.position.set(
      (Math.random()-.5)*.18,
      (Math.random()-.5)*.14,
      .7 + Math.random()*.8
    );

    // 이전보다 훨씬 큰 이모지
    const size = .30 + Math.random()*.34;
    sprite.scale.set(size,size,size);

    group.add(sprite);

    // 시작 위치에서 바깥쪽으로 빠르게 퍼지는 속도
    const speed = .018 + Math.random()*.035;

    particleData.push({
      sprite,
      vx:Math.cos(angle)*speed*spread,
      vy:Math.sin(angle)*speed*.82*spread,
      vz:(Math.random()-.5)*.010,
      spin:(Math.random()-.5)*.035,
      phase:Math.random()*Math.PI*2
    });
  }

  // 파티클이 생기는 순간의 글자 위치를 그대로 시작점으로 사용
  group.position.copy(textGroup.position);
  scene.add(group);

  const born=performance.now();
  const lifetime=2.2+Math.random()*.8;

  function animateParticles(now){
    const t=(now-born)/1000;

    for(const p of particleData){
      p.sprite.position.x += p.vx;
      p.sprite.position.y += p.vy;
      p.sprite.position.z += p.vz;

      // 살짝 감속하면서 자연스럽게 퍼짐
      p.vx *= .997;
      p.vy *= .997;
      p.vy -= .00008;

      p.sprite.material.rotation += p.spin;

      const pulse=1+Math.sin(t*3+p.phase)*.07;
      const base=p.sprite.scale.x/(1+Math.sin(t*3+p.phase-.016)*.07);
      p.sprite.scale.set(base*pulse,base*pulse,base*pulse);
    }

    // 등장 직후 빠르게 나타나고, 마지막에 부드럽게 사라짐
    const fadeIn=Math.min(1,t/.12);
    const fadeOut=Math.max(0,1-(t-(lifetime-.7))/.7);
    const opacity=.92*fadeIn*Math.min(1,fadeOut);

    for(const p of particleData){
      p.sprite.material.opacity=opacity;
    }

    if(t<lifetime){
      requestAnimationFrame(animateParticles);
    }else{
      for(const p of particleData){
        p.sprite.material.dispose();
      }
      scene.remove(group);
    }
  }

  requestAnimationFrame(animateParticles);
}

function burst(){
  // 기존 110개에서 약 66% 수준인 73개
  createEmojiBurst(73);
}

// 글자를 기준으로 일정 시간마다 작은 "팡!"이 발생합니다.
// 테두리에서 들어오는 파티클은 사용하지 않습니다.
let lastAmbientParticle=0;

function ambientParticles(now){
  if(!active) return;
  if(now-lastAmbientParticle<1250) return;

  lastAmbientParticle=now;

  // 한 번에 약 66% 수준으로 줄인 12~21개
  const count=12+Math.floor(Math.random()*10);
  createEmojiBurst(count);
}
// 부드러운 RGB 조명. 충돌 여부/방향 전환과 완전히 독립적입니다.
function updateLights(time){
  const t=time*0.00018;
  const hues=[t%1,(t+1/3)%1,(t+2/3)%1];
  for(let i=0;i<3;i++){
    lights[i].color.copy(hsl(hues[i],.92,.55));
    // 밝기도 아주 완만하게 변화
    lights[i].intensity = 2.15 + .45*Math.sin(time*0.00065+i*2.1);
  }
  // 클럽 느낌의 딥 퍼플 → 일렉트릭 블루 → 핫 마젠타.
  // 한 색을 2초 동안 유지한 뒤, 0.5초 동안만 다음 색으로 페이드합니다.
  const clubColors = [
    new THREE.Color(0x24003f),
    new THREE.Color(0x001b55),
    new THREE.Color(0x4d003d)
  ];

  const cycleLength = 2500; // 유지 2000ms + 페이드 500ms
  const cycle = (time % (clubColors.length * cycleLength)) / cycleLength;
  const index = Math.floor(cycle) % clubColors.length;
  const phase = cycle - Math.floor(cycle);

  let targetBg;

  if (phase < 0.8) {
    // 처음 2초: 같은 색 유지
    targetBg = clubColors[index];
  } else {
    // 마지막 0.5초: 다음 색으로만 페이드
    const nextIndex = (index + 1) % clubColors.length;
    const fadeProgress = (phase - 0.8) / 0.2;

    // ease-in-out으로 부드럽게 전환
    const eased = fadeProgress * fadeProgress * (3 - 2 * fadeProgress);
    targetBg = clubColors[index].clone().lerp(clubColors[nextIndex], eased);
  }

  scene.background.lerp(targetBg, .2);
}

function updateBounds(){
  const vFov=THREE.MathUtils.degToRad(camera.fov);
  const height=2*Math.tan(vFov/2)*camera.position.z;
  const width=height*camera.aspect;
  bounds.x=Math.max(1.2,width/2-textWidth/2-.15);
  bounds.y=Math.max(1.0,height/2-textHeight/2-.15);
}

function start(){
  currentText=input.value.trim() || "안녕하세요!";
  createText(currentText);
  inputWrap.classList.add("hidden");
  startBtn.classList.add("hidden");
  hint.classList.add("hidden");
  status.textContent="PLAY";
  active=true;
  birth=performance.now();
  velocity.set((Math.random()<.5?-1:1)*(.045+Math.random()*.025),
               (Math.random()<.5?-1:1)*(.032+Math.random()*.02),0);
  rotationVelocity.set(.0045,.007,.003);
  updateBounds();
  textGroup.scale.set(.05,.05,.05);
  burst();
}

startBtn.addEventListener("click",start);
input.addEventListener("keydown",e=>{if(e.key==="Enter")start();});

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  updateBounds();
});

const clock=new THREE.Clock();
function animate(now){
  requestAnimationFrame(animate);
  const elapsed=clock.getElapsedTime();
  updateLights(now);
  ambientParticles(now);

  if(active){
    const age=(now-birth)/1000;

    // 작아짐 → 약 1초 사라짐 → 부드러운 팝
    if(age<.55){
      const p=age/.55;
      const s=1-p;
      textGroup.scale.setScalar(Math.max(.001,s));
    } else if(age<1.55){
      textGroup.visible=false;
    } else if(age<2.15){
      textGroup.visible=true;
      const p=(age-1.55)/.6;
      const eased=1-Math.pow(1-p,3);
      textGroup.scale.setScalar(.05 + eased*.95);
    } else {
      textGroup.visible=true;
      textGroup.scale.setScalar(1);
    }

    textGroup.position.add(velocity);
    textGroup.rotation.x += rotationVelocity.x;
    textGroup.rotation.y += rotationVelocity.y;
    textGroup.rotation.z += rotationVelocity.z;

    if(textGroup.position.x>bounds.x){textGroup.position.x=bounds.x;velocity.x=-Math.abs(velocity.x);}
    if(textGroup.position.x<-bounds.x){textGroup.position.x=-bounds.x;velocity.x=Math.abs(velocity.x);}
    if(textGroup.position.y>bounds.y){textGroup.position.y=bounds.y;velocity.y=-Math.abs(velocity.y);}
    if(textGroup.position.y<-bounds.y){textGroup.position.y=-bounds.y;velocity.y=Math.abs(velocity.y);}
  }

  renderer.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
